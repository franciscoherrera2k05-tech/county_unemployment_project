# Monthly batch run of the county unemployment pipeline.
# What it does: installs uv + Python, then runs the monthly_pipeline Prefect flow (ingest -> staging -> panel -> tests).
# In: repository secrets (never hardcoded). Out: refreshed tables in the MotherDuck `unemployment` database.
# Schedule: day 28 at 14:00 UTC. BLS posts county data for month t with the Metropolitan Area release, usually in the
# first days of month t+2 (e.g. October 2026 data on Dec 2, 2026), so the 28th is safely after most releases.
name: monthly-pipeline

on:
  schedule:
    - cron: "0 14 28 * *"
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      BLS_CONTACT_EMAIL: ${{ secrets.BLS_CONTACT_EMAIL }}
      PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
      PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python scripts/preflight.py
      - run: uv run python -m src.flows.monthly_pipeline
